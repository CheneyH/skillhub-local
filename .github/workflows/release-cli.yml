name: Release CLI

on:
  push:
    tags: ['cli-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. cli-v0.1.5)'
        required: true
      skip_npm:
        description: 'Skip npm publish'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
      package_name: ${{ steps.extract.outputs.package_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        working-directory: cli
        run: bun install --frozen-lockfile

      - name: Run linter
        working-directory: cli
        run: bun run lint

      - name: Run type check
        working-directory: cli
        run: bun run typecheck

      - name: Run tests
        working-directory: cli
        run: bun test

      - name: Build CLI
        working-directory: cli
        run: bun run build

      - name: Extract version info
        id: extract
        working-directory: cli
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "package_name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "Extracted version: $VERSION"
          echo "Package name: $PACKAGE_NAME"

      - name: Verify built CLI
        working-directory: cli
        run: |
          node dist/index.js version
          RUNTIME_VERSION=$(node dist/index.js version | sed -E 's/^SkillHub CLI //')
          if [ "$RUNTIME_VERSION" != "${{ steps.extract.outputs.version }}" ]; then
            echo "Version mismatch: runtime=$RUNTIME_VERSION, package.json=${{ steps.extract.outputs.version }}"
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cli-dist
          path: |
            cli/dist/
            cli/package.json
            cli/README.md
            cli/LICENSE
          retention-days: 7

  publish-npm:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_npm }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: ${{ vars.NPM_REGISTRY || 'https://registry.npmjs.org' }}

      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@latest

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        working-directory: cli
        run: bun install --frozen-lockfile

      - name: Build CLI
        working-directory: cli
        run: bun run build

      - name: Check if version exists on npm
        id: check_npm
        env:
          NPM_REGISTRY: ${{ vars.NPM_REGISTRY || 'https://registry.npmjs.org' }}
        run: |
          PACKAGE_NAME="${{ needs.build-and-test.outputs.package_name }}"
          VERSION="${{ needs.build-and-test.outputs.version }}"

          if npm view "${PACKAGE_NAME}@${VERSION}" version --registry "$NPM_REGISTRY" 2>&1 | grep -Eiq '(E404|404 Not Found|is not in this registry|Not found)'; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Version $VERSION does not exist on registry, proceeding with publish"
          else
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Version $VERSION already exists on registry, skipping publish"
          fi

      - name: Publish to npm via Trusted Publishing
        if: steps.check_npm.outputs.exists == 'false'
        working-directory: cli
        run: |
          npm publish --access public --provenance
          echo "Published ${{ needs.build-and-test.outputs.package_name }}@${{ needs.build-and-test.outputs.version }}"

  create-release:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: cli-dist
          path: cli-release

      - name: Create release archives
        run: |
          VERSION="${{ needs.build-and-test.outputs.version }}"

          # Create tar.gz
          tar -czf "skillhub-cli-${VERSION}.tar.gz" -C cli-release .

          # Create zip
          (cd cli-release && zip -r "../skillhub-cli-${VERSION}.zip" .)

          # Generate checksums
          sha256sum "skillhub-cli-${VERSION}.tar.gz" > "skillhub-cli-${VERSION}.tar.gz.sha256"
          sha256sum "skillhub-cli-${VERSION}.zip" > "skillhub-cli-${VERSION}.zip.sha256"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${{ needs.build-and-test.outputs.version }}"
          PACKAGE_NAME="${{ needs.build-and-test.outputs.package_name }}"

          # Generate release notes
          cat > release-notes.md <<EOF
          # SkillHub CLI ${VERSION}

          ## Installation

          ### npm
          \`\`\`bash
          npm install -g ${PACKAGE_NAME}@${VERSION}
          \`\`\`

          ### From source
          Download and extract the archive, then:
          \`\`\`bash
          npm install -g .
          \`\`\`

          ## Verify installation
          \`\`\`bash
          skillhub version
          \`\`\`

          ## Changes
          See commit history for details.
          EOF

          gh release create "$TAG" \
            --title "CLI ${VERSION}" \
            --notes-file release-notes.md \
            "skillhub-cli-${VERSION}.tar.gz" \
            "skillhub-cli-${VERSION}.tar.gz.sha256" \
            "skillhub-cli-${VERSION}.zip" \
            "skillhub-cli-${VERSION}.zip.sha256"
